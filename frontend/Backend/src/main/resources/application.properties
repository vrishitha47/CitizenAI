# ===============================
# Server
# ===============================
server.port=8080

# ===============================
# MySQL Datasource
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/civic_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Rahul@1606
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ===============================
# JWT
# ===============================
# 256-bit base64 secret (change in production). Generate your own with: openssl rand -base64 32
app.jwt.secret=Y2l2aWNTeXN0ZW1TdXBlclNlY3JldEtleUNoYW5nZU1lSW5Qcm9kdWN0aW9uMTIzNDU2Nzg5MA==
app.jwt.expiration-ms=86400000

# ===============================
# File upload (complaint images)
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# Where uploaded images are stored on disk (relative to backend working dir)
app.upload.dir=uploads
# Public URL prefix these images are served under
app.upload.public-prefix=/uploads

# ===============================
# Demo data
# ===============================
# Seeds sample complaints on first startup (only if the DB has none).
# Set to false once you have real data you don't want mixed with samples.
app.seed-demo=true

# ===============================
# AI microservice
# ===============================
app.ai.base-url=http://localhost:8000
app.ai.timeout-ms=8000

# ===============================
# Jackson
# ===============================
spring.jackson.serialization.write-dates-as-timestamps=false
